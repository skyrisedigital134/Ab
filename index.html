<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyRise 3D | Next Level</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        #canvas-container {
            position: fixed; top: 0; left: 0; z-index: -1;
            width: 100%; height: 100vh;
        }

        .content {
            position: relative; z-index: 1;
            padding: 20px; text-align: center;
        }

        /* 3D Glass Header */
        header {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        header h1 {
            font-size: 3.5rem; letter-spacing: 10px;
            text-transform: uppercase; font-weight: 900;
            background: linear-gradient(45deg, #fff, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
        }

        /* Animated Project Sections */
        .project-section {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            margin: 100px 20px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .project-section h2 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 20px; }
        
        .btn-3d {
            padding: 15px 40px; background: transparent;
            border: 2px solid #38bdf8; color: #38bdf8;
            font-weight: bold; border-radius: 50px;
            text-decoration: none; transition: 0.3s;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .btn-3d:hover { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <header>
            <img src="logo.png" alt="Logo" style="height: 80px; margin-bottom: 20px;">
            <h1 id="title">SKYRISE</h1>
            <p style="letter-spacing: 5px; color: #888;">3D DIGITAL EXPERIENCE</p>
        </header>

        <div class="project-section">
            <h2>QR GENERATOR</h2>
            <p style="margin-bottom: 30px; color: #ccc;">Interactive 3D Integrated Tool</p>
            <a href="https://skyrisedigital134.github.io/QR-Generator-/" class="btn-3d">LAUNCH APP</a>
        </div>

        <div class="project-section">
            <h2>SONU BAND</h2>
            <p style="margin-bottom: 30px; color: #ccc;">Premium Musical Portfolio</p>
            <a href="https://sonuband.netlify.app/" class="btn-3d">EXPLORE SITE</a>
        </div>
    </div>

    <script>
        // --- THREE.JS 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create a 3D Geometry (Floating Wireframe Torus)
        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x38bdf8, 
            wireframe: true,
            transparent: true,
            opacity: 0.5 
        });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        camera.position.z = 30;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // Mouse/Touch Interaction
        window.addEventListener('scroll', () => {
            const scrollPercent = window.scrollY / document.body.scrollHeight;
            torusKnot.rotation.z = scrollPercent * 10;
            torusKnot.scale.set(1 + scrollPercent, 1 + scrollPercent, 1 + scrollPercent);
        });

        // Resize handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
